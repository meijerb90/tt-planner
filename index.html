<!doctype html>
<html lang="en">

<title>Table Tennis Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plan a table tennis tournament: seeded group draw, live standings and a knockout bracket with a third-place match. Free, no sign-up, works on phones.">
<meta name="theme-color" content="#3f78b8">
<meta property="og:type" content="website">
<meta property="og:title" content="Table Tennis Planner">
<meta property="og:description" content="Seeded group draw, live standings and a knockout bracket with a third-place match.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Ccircle cx='17' cy='17' r='15' fill='%23e4eefa' stroke='%234a5058' stroke-width='1.2'/%3E%3Ccircle cx='17' cy='17' r='3.2' fill='%233f78b8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one centred column. A three-step pager on top shows a single stage at a time; earlier stages stay reachable. */
:root{
  --paper:#ffffff; --sky-50:#f3f8fd; --sky-100:#e4eefa; --sky-200:#cfe0f3; --sky-400:#7fa9d8; --sky-600:#3f78b8; --sky-800:#1d4a7d;
  --ink:#2a2f36; --ink-2:#5a626c; --line:#4a5058; --line-soft:#9aa1aa;
  --ok-bg:#d6efdc; --ok-line:#3b9a54; --ok-ink:#17562b;
  --no-bg:#f8d9d9; --no-line:#c95151; --no-ink:#7d2222;
  --gold:#f3d14f; --gold-soft:#fbeeb4; --gold-ink:#5b4300; --gold-line:#b88a00;
  --silver:#d4dbe2; --silver-soft:#eef2f5; --silver-ink:#3a434c; --silver-line:#8d99a6;
  --bronze:#dba06a; --bronze-soft:#f3e2cc; --bronze-ink:#5c3a14; --bronze-line:#a9703a;
  --warn-bg:#fdf0cf; --warn-ink:#6b4b00;
  --band-bg:#eef0f1;
  --backdrop:rgba(29,74,125,.55);
  --f-display:'Bricolage Grotesque',system-ui,sans-serif; --f-body:'Figtree',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--f-body);font-variant-numeric:tabular-nums;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;color:var(--sky-800);text-wrap:balance;font-weight:700}
h1{font-size:22px;line-height:1.2} h2{font-size:21px} h3{font-size:16px} h4{font-size:13px}
p{margin:0}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{height:44px;width:44px;display:block}
button,input,select,textarea{font:inherit;color:inherit}
.btn{appearance:none;background:var(--sky-600);color:#fff;border:1px solid var(--sky-800);border-radius:6px;padding:8px 16px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--sky-800)}
.btn.ghost{background:#fff;color:var(--sky-800);border-color:var(--line)}
.btn.ghost:hover{background:var(--sky-50)}
.btn.small{padding:4px 10px;font-size:13px;font-weight:500}
.msg.err{font-size:14px;margin-top:0}
.tools-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang .lb{appearance:none;border:0;background:#fff;color:var(--sky-800);padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer}
.lang .lb+.lb{border-left:1px solid var(--line)}
.lang .lb.on{background:var(--sky-600);color:#fff}
.savenote{color:var(--ink-2);font-size:13px;margin:-4px 0 14px;max-width:70ch}
.in-viewer .savebar{display:none}
.mc.bye{background:var(--sky-50)}
.byebody{padding:8px 4px 4px;font-size:14px}
.byebody small{color:var(--ink-2);margin-right:4px}
.btn:disabled{background:var(--sky-100);color:#8b939c;border-color:var(--line-soft);cursor:not-allowed}
:focus-visible{outline:2px solid var(--sky-400);outline-offset:2px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 22px;background:#fff}
.step{appearance:none;border:0;border-right:1px solid var(--line);background:#fff;color:var(--ink-2);font-weight:500;padding:11px 8px;display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer;min-width:0}
.step:last-child{border-right:0}
.step .n{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:12px}
.step .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.done{background:var(--sky-100);color:var(--sky-800)}
.step.on{background:var(--sky-600);color:#fff}
.step.lock{color:#a0a7af;background:#fafbfc;cursor:not-allowed}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.lead{color:var(--ink-2);max-width:64ch;margin-top:4px}
.prog{border:1px solid var(--line);border-radius:20px;padding:3px 12px;background:var(--sky-50);font-size:13px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:500;margin-bottom:3px}
.fld small{display:block;color:var(--ink-2);font-size:12px;margin-top:3px;line-height:1.3}
input.num,input.pname,input.ord,textarea{border:1px solid var(--line);border-radius:5px;background:#fff;height:34px;padding:0 9px;width:100%}
textarea{height:110px;padding:8px 9px;resize:vertical}
.msg{border:1px solid;border-radius:8px;padding:9px 14px;margin-bottom:10px;font-size:14px}
.msg ul{margin:4px 0 0;padding-left:18px}
.msg.err{background:var(--no-bg);border-color:var(--no-line);color:var(--no-ink)}
.msg.warn{background:var(--warn-bg);border-color:var(--gold-line);color:var(--warn-ink)}
.msg.info{background:var(--sky-50);border-color:var(--sky-400);color:var(--sky-800)}
.plhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0 8px}
.plhead .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.paste{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:10px;background:var(--sky-50)}
details.paste summary{cursor:pointer;font-weight:500}
details.paste .row{display:flex;gap:10px;margin-top:8px;align-items:flex-start;flex-wrap:wrap}
details.paste textarea{flex:1 1 260px}
.plist{border:1px solid var(--line);border-radius:8px;max-height:430px;overflow:auto;background:#fff}
.prow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--sky-200)}
.prow:last-child{border-bottom:0}
.prow.seed{background:var(--sky-50)}
.prow.band{background:var(--band-bg)}
.prow.cut{border-bottom:2px dashed var(--sky-400)}
.pmid{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-width:0}
.pmid .pname{flex:1;min-width:64px}
.prow .tools{display:flex;gap:4px;align-items:center}
.ibtn{appearance:none;background:#fff;border:1px solid var(--line-soft);border-radius:5px;width:30px;height:30px;cursor:pointer;line-height:1}
.ibtn:hover{background:var(--sky-100)}
.seedmark{font-size:11px;border:1px solid var(--sky-600);color:var(--sky-800);border-radius:10px;padding:0 7px;background:#fff;margin-right:4px}
.cta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
.cta .hint{color:var(--ink-2);font-size:13px}
.confirm{background:var(--warn-bg);border:1px solid var(--gold-line);border-radius:8px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;color:var(--warn-ink)}
.confirm span{flex:1 1 260px}
.drawbd{position:fixed;inset:0;background:var(--backdrop);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.drawbox{background:var(--paper);border:1px solid var(--line);border-radius:12px;max-width:600px;width:100%;max-height:min(680px,92vh);overflow:auto;padding:18px 20px 20px}
.drawbox h2{margin-bottom:10px}
.draw-progress{color:var(--ink-2);font-size:13px;margin:0 0 10px}
.draw-reveal{background:var(--sky-50);border:1px solid var(--sky-400);border-radius:10px;padding:16px;text-align:center;margin-bottom:16px}
.draw-reveal .nm{font:700 24px var(--f-display);color:var(--sky-800)}
.draw-reveal .slot{color:var(--sky-800);font-size:13px;margin-top:4px}
.drawgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:18px}
.drawcol{border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.drawcol h4{text-align:center;padding:5px 0;background:var(--sky-100);border-bottom:1px solid var(--line)}
.drawcol .slotrow{padding:4px 8px;font-size:12.5px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:24px;justify-content:center}
.drawcol .slotrow:first-of-type{border-top:0}
.drawcol .slotrow .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.drawcol .slotrow.empty{color:#8b939c;font-style:italic}
.draw-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.gchip{appearance:none;border:1px solid var(--line);background:#fff;border-radius:16px;padding:2px 12px;font-size:13px;cursor:pointer}
.gchip.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
.ggrid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.gcard{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;min-width:0}
.ghead{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--sky-100);border-bottom:1px solid var(--line)}
.chip{font-size:12px;border:1px solid var(--line-soft);border-radius:12px;padding:0 9px;background:#fff;color:var(--ink-2)}
.chip.ok{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok-ink)}
.gbody{padding:12px;display:grid;gap:12px}
.mb{min-width:0}
.mc{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;min-width:0}
.mm{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);margin-bottom:4px;min-height:22px}
select.wo{font-size:11.5px;border:1px solid var(--line-soft);border-radius:4px;background:#fff;color:var(--ink-2);height:22px;max-width:150px;padding:0 2px}
.sheet{display:grid;grid-template-rows:repeat(3,auto);grid-auto-flow:column;grid-template-columns:minmax(0,1fr) repeat(5,32px) 30px;gap:1px;background:var(--line-soft);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.sheet.withpt{grid-template-columns:minmax(0,1fr) repeat(5,32px) 30px 26px}
.sheet>*{background:#fff;min-width:0}
.sheet>.hc{font-size:11px;color:var(--ink-2);text-align:center;padding:3px 0;background:var(--sky-50)}
.nmc{padding:0 8px;display:flex;align-items:center;gap:5px;height:30px;font-weight:500}
.nmc .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nmc small{color:var(--ink-2);font-weight:400;font-size:11.5px;flex:none}
.nmc.tbd .tx{color:#8b939c;font-weight:400;font-style:italic}
.c{height:30px;display:grid;place-items:center;font-weight:500}
.sheet>.w{background:var(--ok-bg)} .sheet>.l{background:var(--no-bg)} .sheet>.gold{background:var(--gold)}
.sheet>.silver{background:var(--silver)} .sheet>.bronze{background:var(--bronze)}
.sc{width:100%;height:30px;border:0;background:transparent;text-align:center;padding:0;border-radius:0}
.sc:focus{outline:2px solid var(--sky-400);outline-offset:-2px;background:#fff}
.sc.gw{font-weight:700}
.sc.bad{background:#fff;box-shadow:inset 0 0 0 2px var(--no-line)}
.sc:disabled{color:var(--ink);opacity:1}
.err{color:var(--no-ink);font-size:12px;margin-top:4px}
table.st{width:100%;border-collapse:collapse;font-size:13.5px}
.st th{background:var(--sky-100);color:var(--sky-800);font-weight:600;font-size:12px;padding:5px 6px;border:1px solid var(--line)}
.st td{padding:5px 6px;border:1px solid var(--line);text-align:center;background:#fff}
.st td.l,.st th.l{text-align:left}
.st tr.g td{background:var(--ok-bg)} .st tr.r td{background:var(--no-bg)}
.tag{font-size:11px;border:1px solid var(--line-soft);border-radius:10px;padding:0 6px;margin-left:5px;background:#fff;color:var(--ink-2);white-space:nowrap}
.tag.ok{border-color:var(--ok-line);color:var(--ok-ink)}
.tag.seed{border-color:var(--sky-600);color:var(--sky-800)}
.panel{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:18px;background:#fff;overflow-x:auto}
.panel h3{margin-bottom:6px}
.panel p.n{color:var(--ink-2);font-size:13px;margin:0 0 10px}
.bracket{display:flex;gap:22px;overflow-x:auto;padding:4px 2px 14px;align-items:stretch}
.rcol{display:flex;flex-direction:column;flex:0 0 296px;min-width:0}
.rcol>h4{text-align:center;padding:6px 0;margin-bottom:8px;background:var(--sky-100);border:1px solid var(--line);border-radius:6px}
.rcol.act>h4{background:var(--sky-600);color:#fff}
.rbody{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:14px}
.rnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.champ{display:flex;gap:14px 26px;align-items:flex-start;flex-wrap:wrap;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:10px;padding:12px 16px;margin-bottom:16px}
.champ .place{display:flex;flex-direction:column;gap:4px}
.champ .place>span{color:var(--gold-ink);font-size:13px}
.champ .big{border-radius:8px;padding:4px 14px;font:700 20px var(--f-display)}
.champ .big.gold{background:var(--gold);border:1px solid var(--gold-line);color:var(--gold-ink)}
.champ .big.silver{background:var(--silver);border:1px solid var(--silver-line);color:var(--silver-ink)}
.champ .big.bronze{background:var(--bronze);border:1px solid var(--bronze-line);color:var(--bronze-ink)}
.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:12px}
.legend i{display:inline-block;width:12px;height:12px;border:1px solid var(--line);border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (max-width:520px){
  h2{font-size:19px}.step .t{font-size:13px}.step .n{display:none}
  .sheet{grid-template-columns:minmax(0,1fr) repeat(5,27px) 26px}
  .sheet.withpt{grid-template-columns:minmax(0,1fr) repeat(5,27px) 26px 22px}
  .nmc{padding:0 6px;gap:4px}.nmc small{display:none}
  .gbody{padding:10px}.mc{padding:6px}
  .sc,input.num,input.pname,input.ord,textarea,select.wo{font-size:16px}
  select.wo{height:28px;max-width:215px}
  .rcol{flex-basis:calc(100vw - 48px)}
  .drawbox{padding:14px}
  .draw-reveal .nm{font-size:20px}
  .drawgrid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
}
@media (prefers-reduced-motion:no-preference){.sc{transition:background .12s}}
</style>
</head>

<script>
//#CORE-START
function toInt(s){ if(s===''||s==null) return null; const n=Number(s); return Number.isInteger(n)&&n>=0?n:NaN; }
function validGame(x,y){ const hi=Math.max(x,y), lo=Math.min(x,y); if(hi<11) return false; if(hi===11) return hi-lo>=2; return hi-lo===2; }
function emptyEntry(){ return {g:[['',''],['',''],['',''],['',''],['','']],wo:null}; }
function ordinal(n){ const s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function letter(i){ return String.fromCharCode(65+i); }

function evalEntry(e){
  const r={ga:0,gb:0,pa:0,pb:0,done:false,winner:null,bad:{},gw:{},started:false,wo:null};
  if(!e) return r;
  if(e.wo==='a'||e.wo==='b'){
    r.wo=e.wo; r.done=true; r.winner=e.wo; r.started=true;
    if(e.wo==='a'){r.ga=3;r.pa=33;}else{r.gb=3;r.pb=33;}
    return r;
  }
  let decided=false,gap=false;
  for(let i=0;i<5;i++){
    const gm=(e.g&&e.g[i])||['',''];
    const x=toInt(gm[0]),y=toInt(gm[1]);
    if(x===null&&y===null){gap=true;continue;}
    r.started=true;
    if(decided){r.bad[i]='err_decided';continue;}
    if(gap){r.bad[i]='err_order';continue;}
    if(x===null||y===null){gap=true;continue;}
    if(isNaN(x)||isNaN(y)||!validGame(x,y)){r.bad[i]='err_game';gap=true;continue;}
    r.pa+=x;r.pb+=y;
    if(x>y){r.ga++;r.gw[i]='a';}else{r.gb++;r.gw[i]='b';}
    if(r.ga===3||r.gb===3){decided=true;r.done=true;r.winner=r.ga===3?'a':'b';}
  }
  if(Object.keys(r.bad).length){r.done=false;r.winner=null;}
  return r;
}

function roundRobin(ids){
  let arr=ids.slice(); if(arr.length%2) arr.push(null);
  const n=arr.length,rounds=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i]; if(a!=null&&b!=null) pairs.push([a,b]);}
    rounds.push(pairs);
    arr=[arr[0],arr[n-1]].concat(arr.slice(1,n-1));
  }
  return rounds;
}
function buildMatches(pids){
  const ms=[];
  roundRobin(pids).forEach((rd,ri)=>rd.forEach((pr,k)=>ms.push({id:ri+'-'+k,a:pr[0],b:pr[1],round:ri+1,e:emptyEntry()})));
  return ms;
}
function shuffle(a,rng){ for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;} return a; }
function drawGroups(ids,G,seedCount,rng){
  rng=rng||Math.random;
  const gr=Array.from({length:G},()=>[]),seq=[];
  const place=(pid,g)=>{ seq.push({pid,g,pos:gr[g].length}); gr[g].push(pid); };
  const seeds=ids.slice(0,seedCount),rest=ids.slice(seedCount);
  for(let k=0;k*G<seeds.length;k++){
    seeds.slice(k*G,(k+1)*G).forEach((pid,i)=>{ place(pid,k%2===0?i:G-1-i); });
  }
  for(let k=0;k*G<rest.length;k++){
    const chunk=rest.slice(k*G,(k+1)*G);
    let order=shuffle(Array.from({length:G},(_,i)=>i),rng);
    if(chunk.length<G) order=order.sort((x,y)=>gr[x].length-gr[y].length);
    chunk.forEach((pid,i)=>place(pid,order[i]));
  }
  return {groups:gr,seq};
}

function tally(group,ev,filter){
  const T={}; group.pids.forEach(p=>{T[p]={pid:p,p:0,w:0,gw:0,gl:0,pw:0,pl:0};});
  group.matches.forEach(m=>{
    const r=ev[m.id]; if(!r.done||(filter&&!filter(m))) return;
    const A=T[m.a],B=T[m.b]; A.p++;B.p++;
    A.gw+=r.ga;A.gl+=r.gb;B.gw+=r.gb;B.gl+=r.ga;
    A.pw+=r.pa;A.pl+=r.pb;B.pw+=r.pb;B.pl+=r.pa;
    if(r.winner==='a')A.w++;else B.w++;
  });
  return T;
}
function cmpKey(a,b){ for(let i=0;i<a.length;i++){ if(a[i]!==b[i]) return a[i]-b[i]; } return 0; }

function rankGroup(group,ev,lots){
  const all=tally(group,ev);
  const complete=group.matches.every(m=>ev[m.id].done);
  const byW={};
  group.pids.forEach(p=>{(byW[all[p].w]=byW[all[p].w]||[]).push(Object.assign({},all[p]));});
  const ordered=[];
  Object.keys(byW).map(Number).sort((a,b)=>b-a).forEach(w=>{
    const blk=byW[w];
    if(blk.length>1){
      const set=new Set(blk.map(r=>r.pid));
      const h=tally(group,ev,m=>set.has(m.a)&&set.has(m.b));
      blk.forEach(r=>{const x=h[r.pid]; r.key=[x.w,x.gw-x.gl,x.pw-x.pl,r.gw-r.gl,r.pw-r.pl];});
      blk.sort((a,b)=>cmpKey(b.key.concat([lots[b.pid]||0]),a.key.concat([lots[a.pid]||0])));
      for(let i=0;i<blk.length;i++){
        const tied=(j)=>j>=0&&j<blk.length&&cmpKey(blk[i].key,blk[j].key)===0;
        if(tied(i-1)||tied(i+1)) blk[i].lot=true;
      }
    }
    blk.forEach(r=>ordered.push(r));
  });
  ordered.forEach((r,i)=>{r.rank=i+1;});
  return {rows:ordered,complete};
}
function adjStats(group,ev,rows,pid,m){
  const excl=new Set(rows.filter(r=>r.rank>m).map(r=>r.pid)); excl.delete(pid);
  return tally(group,ev,x=>!excl.has(x.a)&&!excl.has(x.b))[pid];
}

function nextPow2(n){ let k=2; while(k<n) k*=2; return k; }
function koPlan(sizes,A){
  const G=sizes.length,direct=G*A,K=nextPow2(direct);
  const cand=sizes.filter(z=>z>=A+1).length,need=K-direct;
  const extra=need<=cand?need:0;
  return {G,direct,K,extra,N:direct+extra,byes:K-direct-extra,cand};
}

function qualification(S){
  const A=(S.cfg&&S.cfg.adv)||S.setup.adv;
  const plan=koPlan(S.groups.map(g=>g.pids.length),A),extra=plan.extra;
  const ev={},rk={};
  S.groups.forEach(g=>{
    const e={}; g.matches.forEach(m=>{e[m.id]=evalEntry(m.e);});
    ev[g.name]=e; rk[g.name]=rankGroup(g,e,S.lots||{});
  });
  const allComplete=S.groups.every(g=>rk[g.name].complete);
  const res={ev,rk,allComplete,extra,plan,tiers:[],qualified:{},seedList:[],extraList:null};
  if(!allComplete) return res;
  const mGlobal=Math.min.apply(null,S.groups.map(g=>g.pids.length));
  const tier=(t,m)=>{
    const list=[];
    S.groups.forEach(g=>{
      if(g.pids.length<t) return;
      const rows=rk[g.name].rows,row=rows[t-1],st=adjStats(g,ev[g.name],rows,row.pid,m);
      list.push({pid:row.pid,group:g.name,pos:t,w:st.w,gd:st.gw-st.gl,pd:st.pw-st.pl,key:[st.w,st.gw-st.gl,st.pw-st.pl]});
    });

function seedOrder(K){ let a=[1,2]; for(let n=4;n<=K;n*=2){ const b=[]; a.forEach(s=>{b.push(s,n+1-s);}); a=b; } return a; }

  for(let i=0;i<pairs.length;i++){
    if(!clash(pairs[i])) continue;

    for(let j=0;j<pairs.length;j++){
      if(j===i||!by(pairs[j][1])) continue;
      const a=[pairs[i][0],pairs[j][1]],b=[pairs[j][0],pairs[i][1]];
      if(clash(a)||clash(b)) continue;
      const d=Math.abs(pairs[i][1]-pairs[j][1]); if(d<bd){bd=d;best=j;}

    if(best!==null){const t=pairs[i][1];pairs[i][1]=pairs[best][1];pairs[best][1]=t;}

function koModel(ko){
  const all={};

    const bye=!!isFirst&&((a==null)!==(b==null));

    const entry=sig&&ko.entries[id]&&ko.entries[id].sig===sig?ko.entries[id]:null;
    const ev=evalEntry(entry);
    const m={id,a,b,sig,entry,ev,bye,w:null,l:null};
    if(bye){ m.w=a||b; }
    else if(ev.done){ m.w=ev.winner==='a'?a:b; m.l=ev.winner==='a'?b:a; }

  };
  const R=Math.round(Math.log2(ko.K)),rounds=[ko.first.map((p,i)=>mk('R0-'+i,p[0],p[1],true))];
  for(let r=1;r<R;r++){
    const prev=rounds[r-1],cur=[];
    for(let i=0;i<prev.length/2;i++) cur.push(mk('R'+r+'-'+i,prev[2*i].w,prev[2*i+1].w));
    rounds.push(cur);
  }
  const fin=rounds[R-1][0];
  let third=null;

}

function validateSetup(s,n){

  if(n<4) E.push(M('v_n_min'));
  if(n>128) E.push(M('v_n_max'));
  if(G<1||G>26) E.push(M('v_g_range'));
  let sizes=[];
  if(G>=1&&G<=26&&n>=1){
    const base=Math.floor(n/G),ex=n%G;
    sizes=Array.from({length:G},(_,i)=>i<ex?base+1:base);
    const need=Math.ceil(n/G);
    if(P!==need) E.push(M('v_per',{n,G,ex,base,need}));
    if(base<2) E.push(M('v_base'));
  }
  if(A<1) E.push(M('v_adv_min'));
  const minSize=sizes.length?Math.min.apply(null,sizes):0;
  if(sizes.length&&A>=1&&A>minSize) E.push(M('v_adv_max',{min:minSize}));
  let plan=null;
  if(sizes.length&&A>=1&&A<=minSize){
    plan=koPlan(sizes,A);
    if(plan.direct<2) E.push(M('v_direct_min'));
    if(plan.K>64) E.push(M('v_k_max',{direct:plan.direct}));
  }
  if(SD<0||SD>n) E.push(M('v_seeds_range'));
  if(!E.length){
    if(new Set(sizes).size>1) W.push(M('w_uneven',{max:Math.max.apply(null,sizes),min:minSize}));
    if(minSize<=3) W.push(M('w_small'));
    if(SD>0&&SD%G!==0) W.push(M('w_seeds_uneven',{sd:SD,G}));
    if(SD<G) W.push(M('w_seeds_few',{sd:SD,G}));

    if(plan&&A>=minSize) W.push(M('w_all'));
  }
  return {E,W,sizes,plan};
}

const LANGS=['en','nl'];
function detectLang(){ try{const l=localStorage.getItem('tt-lang'); if(LANGS.indexOf(l)>=0) return l;}catch(e){} return /^nl\b/i.test((typeof navigator!=='undefined'&&navigator.language)||'')?'nl':'en'; }
let LANG=detectLang();
function t(k,v){ const d=DICT[LANG][k]; if(d===undefined) return k; return typeof d==='function'?d(v||{}):d; }
//#I18N-END

/* ---------- state ---------- */
const KEY='tt-planner-v1';
function defaultState(){
  const players=[];
  for(let i=1;i<=32;i++) players.push({id:'p'+i,name:'',order:i});
  return {v:1,nextId:33,setup:{n:32,g:8,per:4,adv:2,seeds:16},players,roster:{},groups:null,lots:{},ko:null,view:'setup'};
}
function load(){ try{const r=localStorage.getItem(KEY); if(r){const s=JSON.parse(r); if(s&&s.v===1&&s.players) return s;}}catch(e){} return null; }
function migrateKo(st){
  const ko=st&&st.ko; if(!ko||ko.first||!ko.r16) return;
  ko.first=ko.r16; delete ko.r16; ko.K=16; ko.N=16;
  const map=k=>k.replace(/^R16-/,'R0-').replace(/^QF-/,'R1-').replace(/^SF-/,'R2-').replace(/^F$/,'R3-0');
  const ne={}; Object.keys(ko.entries||{}).forEach(k=>{ne[map(k)]=ko.entries[k];}); ko.entries=ne;
}
function cleanNames(st){ (st.players||[]).forEach(p=>{ if(/^(Player|Speler) \d+$/.test(p.name)) p.name=''; }); (Object.keys(st.roster||{})).forEach(k=>{ const r=st.roster[k]; if(r&&/^(Player|Speler) \d+$/.test(r.name)) r.name=''; }); }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
let S=load()||defaultState();
migrateKo(S); cleanNames(S);
if(S.view==='groups'&&!S.groups) S.view='setup';
if(S.view==='knockout'&&!S.ko) S.view=S.groups?'groups':'setup';
let ui={confirm:null,notice:null,pending:null,draw:null};
if(window.claude) document.body.classList.add('in-viewer');
const app=document.getElementById('app');
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
function advN(){ return (S.cfg&&S.cfg.adv)||S.setup.adv; }

/* ---------- players ---------- */
function renumber(){ S.players.forEach((p,i)=>{p.order=i+1;}); }
function syncCount(){ S.setup.n=S.players.length; S.setup.per=Math.ceil(S.setup.n/Math.max(1,S.setup.g||1)); }
function addPlayer(){ S.players.push({id:'p'+(S.nextId++),name:'',order:S.players.length+1}); syncCount(); }
function resizePlayers(n){
  n=Math.max(1,Math.min(128,n));
  while(S.players.length<n) S.players.push({id:'p'+(S.nextId++),name:'',order:S.players.length+1});
  if(S.players.length>n) S.players=S.players.slice(0,n);
  renumber(); S.setup.n=n;
}
function movePlayer(id,d){ const i=S.players.findIndex(p=>p.id===id),j=i+d; if(i<0||j<0||j>=S.players.length) return; const t=S.players[i];S.players[i]=S.players[j];S.players[j]=t; renumber(); }
function setOrder(id,v){
  const p=S.players.find(x=>x.id===id); if(!p||!Number.isFinite(v)) return;
  v=Math.max(1,Math.min(S.players.length,Math.round(v))); const old=p.order; if(v===old) return;
  S.players.forEach(x=>{x._k=x.order;}); p._k=v<old?v-0.5:v+0.5;
  S.players.sort((a,b)=>a._k-b._k); S.players.forEach(x=>{delete x._k;}); renumber();
}
function removePlayer(id){ if(S.players.length<=1) return; S.players=S.players.filter(p=>p.id!==id); renumber(); syncCount(); }
function usePasted(txt){
  const names=txt.split(/\r?\n/).map(s=>s.replace(/^\s*\d+[.)]\s*/,'').trim()).filter(Boolean).slice(0,128);
  if(!names.length) return;
  S.players=names.map((nm,i)=>({id:(S.players[i]&&S.players[i].id)||'p'+(S.nextId++),name:nm,order:i+1}));
  syncCount();
}

/* ---------- actions ---------- */
function startDraw(){
  const ids=S.players.map(p=>p.id), seeds=S.setup.seeds;
  const {groups,seq}=drawGroups(ids,S.setup.g,seeds);
  const info={}; S.players.forEach(p=>{info[p.id]={name:pn(p),seed:p.order<=seeds};});
  ui.draw={groups,seq,i:0,info}; ui.confirm=null;
}
function createGroups(gr){
  const seeds=S.setup.seeds;
  const rank={}; S.players.forEach(p=>{rank[p.id]=p.order;});
  S.roster={}; S.players.forEach(p=>{S.roster[p.id]={name:p.name,order:p.order,seed:p.order<=seeds};});
  S.groups=gr.map((pids,i)=>{ pids=pids.slice().sort((a,b)=>rank[a]-rank[b]); return {name:letter(i),pids,matches:buildMatches(pids)}; });
  const ids=S.players.map(p=>p.id);
  S.lots={}; ids.forEach(id=>{S.lots[id]=Math.random();});
  S.cfg={adv:S.setup.adv};
  S.ko=null; S.view='groups'; ui.confirm=null; ui.draw=null;
}
function hasScores(){ return S.groups&&S.groups.some(g=>g.matches.some(m=>m.e.wo||m.e.g.some(x=>x[0]!==''||x[1]!==''))); }
function createKnockout(){
  const q=qualification(S); if(!q.allComplete) return;
  S.ko=makeKnockout(S,q); S.view='knockout';
}
function startOver(){ S.groups=null;S.ko=null;S.roster={};S.lots={};S.view='setup';ui.confirm=null; }

/* ---------- entries ---------- */
function entryFor(ref,create){
  const p=ref.split(':');
  if(p[0]==='g'){ const g=S.groups.find(x=>x.name===p[1]); return g.matches.find(x=>x.id===p[2]).e; }
  const M=koModel(S.ko),m=M.all[p[1]];
  if(!m||!m.sig) return null;
  let e=S.ko.entries[p[1]];
  if(!e||e.sig!==m.sig){ if(!create) return null; e=S.ko.entries[p[1]]={sig:m.sig,g:emptyEntry().g,wo:null}; }
  return e;
}

/* ---------- views ---------- */
function pn(p){ return p.name||t('player_default',{n:p.order}); }
function rn(pid){ const r=S.roster[pid]; return r?(r.name||t('player_default',{n:r.order})):'?'; }
function stepper(){
  const steps=[['setup',t('s_setup'),true],['groups',t('s_groups'),!!S.groups],['knockout',t('s_ko'),!!S.ko]];
  const order=['setup','groups','knockout'],cur=order.indexOf(S.view);
  $('steps').innerHTML=steps.map((s,i)=>{
    const cls=S.view===s[0]?'on':(!s[2]?'lock':(i<cur?'done':''));
    return `<button class="step ${cls}" data-act="go" data-v="${s[0]}" ${s[2]?'':'aria-disabled="true"'} ${S.view===s[0]?'aria-current="step"':''}><span class="n">${i+1}</span><span class="t">${esc(s[1])}</span></button>`;
  }).join('');
}
function noticeBar(){
  const n=ui.notice; if(!n) return ''; ui.notice=null;
  return `<div class="msg ${n.kind==='err'?'err':'info'}" role="status">${esc(t(n.k))}</div>`;
}
function confirmBar(){
  const c=ui.confirm; if(!c) return '';
  return `<div class="confirm" role="alert"><span>${esc(t(c.k))}</span><button class="btn small" data-act="confirm-yes">${esc(t(c.lk))}</button><button class="btn ghost small" data-act="confirm-no">${esc(t('cancel'))}</button></div>`;
}
function drawModalHtml(){
  const D=ui.draw; if(!D) return '';
  const total=D.seq.length, done=D.i>=total;
  const filled=D.groups.map(()=>0);
  D.seq.slice(0,D.i).forEach(s=>{filled[s.g]++;});
  const cur=D.i>0?D.seq[D.i-1]:null;
  const reveal=cur
    ? `<div class="draw-reveal"><div class="nm">${esc(D.info[cur.pid].name)}</div><div class="slot">${esc(t('group_n',{g:letter(cur.g)}))} · ${esc(t('draw_position',{p:cur.pos+1}))}</div></div>`
    : `<p class="lead">${esc(t('draw_intro'))}</p>`;
  const grid=`<div class="drawgrid">${D.groups.map((pids,g)=>`<div class="drawcol"><h4>${esc(t('group_n',{g:letter(g)}))}</h4>${
    pids.map((pid,k)=>k<filled[g]
      ? `<div class="slotrow filled">${D.info[pid].seed?`<span class="seedmark">${esc(t('seed_tag'))}</span>`:''}<span class="tx">${esc(D.info[pid].name)}</span></div>`
      : `<div class="slotrow empty">${esc(t('tbd'))}</div>`).join('')
  }</div>`).join('')}</div>`;
  const progress=cur?`<p class="draw-progress">${esc(t('draw_progress',{i:D.i,n:total}))}</p>`:'';
  const actions=done
    ? `<div class="draw-actions">
        <button class="btn" data-act="draw-commit">${esc(t(S.groups?'create_again':'create_groups'))}</button>
        <button class="btn ghost" data-act="draw-redraw">${esc(t('redraw'))}</button>
        <button class="btn ghost" data-act="draw-cancel">${esc(t('cancel'))}</button>
      </div>`
    : `<div class="draw-actions">
        <button class="btn" data-act="draw-next">${esc(t(D.i===0?'draw_start':'draw_next'))}</button>
        <button class="btn ghost" data-act="draw-cancel">${esc(t('cancel'))}</button>
      </div>`;
  return `<div class="drawbd"><div class="drawbox" role="dialog" aria-modal="true" aria-label="${esc(t('draw_heading'))}">
    <h2>${esc(t('draw_heading'))}</h2>
    ${progress}${reveal}${grid}${actions}
  </div></div>`;
}

/* setup */
function plistHtml(){
  const sd=S.setup.seeds, G=S.setup.g, validG=Number.isInteger(G)&&G>=1;
  const sdN=Number.isInteger(sd)&&sd>0?sd:0, seedPots=validG&&sdN>0?Math.ceil(sdN/G):0;
  return S.players.map((p,i)=>{
    const seeded=Number.isInteger(sd)&&p.order<=sd;
    const cut=Number.isInteger(sd)&&sd>0&&p.order===sd&&i<S.players.length-1;
    const nm=pn(p);
    let bandTag='',bandCls='';
    if(!seeded&&validG){
      const band=Math.floor((i-sdN)/G);
      bandTag=`<span class="tag" title="${esc(t('draw_pos_t'))}">${esc(t('draw_pos',{n:seedPots+band+1}))}</span>`;
      bandCls=band%2===1?'band':'';
    }
    return `<div class="prow ${seeded?'seed':''} ${bandCls} ${cut?'cut':''}">
      <input class="ord" inputmode="numeric" value="${p.order}" data-id="${p.id}" aria-label="${esc(t('aria_order',{name:nm}))}">
      <div class="pmid">${seeded?`<span class="seedmark">${esc(t('seed_tag'))}</span>`:''}${bandTag}<input class="pname" value="${esc(p.name)}" placeholder="${esc(nm)}" data-id="${p.id}" aria-label="${esc(t('aria_name',{n:p.order}))}"></div>
      <div class="tools"><button class="ibtn" data-act="up" data-id="${p.id}" aria-label="${esc(t('aria_up',{name:nm}))}">↑</button><button class="ibtn" data-act="down" data-id="${p.id}" aria-label="${esc(t('aria_down',{name:nm}))}">↓</button><button class="ibtn" data-act="del" data-id="${p.id}" aria-label="${esc(t('aria_del',{name:nm}))}">✕</button></div>
    </div>`;}).join('');
}
function sizesText(sizes){
  const c={}; sizes.forEach(z=>{c[z]=(c[z]||0)+1;});
  return Object.keys(c).map(Number).sort((a,b)=>b-a).map(z=>t('size_part',{c:c[z],z})).join(' '+t('and')+' ');
}
function vboxHtml(V){
  let h='';
  const L=a=>a.map(m=>`<li>${esc(t(m.k,m.v))}</li>`).join('');
  if(V.E.length) h+=`<div class="msg err"><strong>${esc(t('fix_title'))}</strong><ul>${L(V.E)}</ul></div>`;
  if(V.W.length) h+=`<div class="msg warn"><strong>${esc(t('tips_title'))}</strong><ul>${L(V.W)}</ul></div>`;
  if(!V.E.length){
    const p=V.plan,vv=Object.assign({A:S.setup.adv},p);
    const q=t(p.extra>0?'q_extra':p.byes>0?'q_byes':'q_plain',vv);
    h+=`<div class="msg info">${esc(t('info_in',{n:S.players.length,sizes:sizesText(V.sizes)}))} ${esc(q)}</div>`;
  }
  return h;
}
function ctaHtml(V){
  return `<button class="btn" data-act="mkgroups" ${V.E.length?'disabled':''}>${esc(t(S.groups?'create_again':'create_groups'))}</button>`
   +(S.groups?`<span class="hint">${esc(t('groups_exist'))}</span><button class="btn ghost" data-act="go" data-v="groups">${esc(t('back_groups'))}</button>`:'');
}

}

/* match sheet */
function nmObj(pid,info){ if(!pid) return {name:t('tbd'),tbd:true}; const r=S.roster[pid]||{order:''}; return {name:rn(pid),sub:info?info[pid].label:r.order}; }
function sheet(ref,A,B,r,entry,o){
  const g=(entry&&entry.g)||emptyEntry().g;
  const cl=side=>{
    if(!r.done) return '';
    const won=side==='a'?r.winner==='a':r.winner==='b';
    if(o.medal==='final') return won?'gold':'silver';
    if(o.medal==='third') return won?'bronze':'l';
    return won?'w':'l';
  };
  const dis=o.dis||r.wo?'disabled':'';
  const nm=(X,side)=>`<div class="nmc ${cl(side)} ${X.tbd?'tbd':''}">${X.sub!==undefined&&X.sub!==''&&!X.tbd?`<small>${esc(X.sub)}</small>`:''}<span class="tx" title="${esc(X.name)}">${esc(X.name)}</span></div>`;
  let h=`<div class="sheet ${o.pt?'withpt':''}"><div class="hc"></div>${nm(A,'a')}${nm(B,'b')}`;
  for(let i=0;i<5;i++){
    const bad=r.bad[i]?'bad':'';
    const inp=(s,side)=>`<div class="c ${cl(side)}"><input class="sc ${bad} ${r.gw[i]===side?'gw':''}" inputmode="numeric" maxlength="2" autocomplete="off" value="${esc(g[i][s])}" data-ref="${ref}" data-i="${i}" data-s="${s}" data-k="${ref}|${i}|${s}" aria-label="${esc(t('aria_game',{i:i+1,name:s?B.name:A.name}))}" ${dis}></div>`;
    h+=`<div class="hc">G${i+1}</div>${inp(0,'a')}${inp(1,'b')}`;
  }
  const tot=(v,side)=>`<div class="c ${cl(side)}">${r.started||r.done?v:''}</div>`;
  h+=`<div class="hc">Gms</div>${tot(r.ga,'a')}${tot(r.gb,'b')}`;
  if(o.pt){ const pt=(side)=>`<div class="c ${cl(side)}">${r.done?(r.winner===side?1:0):'–'}</div>`; h+=`<div class="hc">Pt</div>${pt('a')}${pt('b')}`; }
  return h+'</div>';
}
function matchBlock(ref,A,B,r,entry,o){
  const wo=(entry&&entry.wo)||'';
  const sel=o.dis&&!wo?'':`<select class="wo" data-ref="${ref}" ${o.dis?'disabled':''} aria-label="${esc(t('wo_aria'))}" title="${esc(t('wo_title'))}"><option value="">${esc(t('wo_played'))}</option><option value="a" ${wo==='a'?'selected':''}>${esc(t('wo_win',{name:A.name}))}</option><option value="b" ${wo==='b'?'selected':''}>${esc(t('wo_win',{name:B.name}))}</option></select>`;
  const badKeys=Object.keys(r.bad);
  const err=badKeys.length?`<div class="err">${esc(t('game_err',{i:+badKeys[0]+1,msg:t(r.bad[badKeys[0]])}))}</div>`:'';
  return `<div class="${o.card?'mc':'mb'}"><div class="mm"><span>${esc(o.label)}</span>${sel}</div>${sheet(ref,A,B,r,entry,o)}${err}</div>`;
}

/* groups */
function standingsHtml(g,q){
  const rk=q.rk[g.name],A=advN();
  let h=`<table class="st"><thead><tr><th>#</th><th class="l">${esc(t('th_player'))}</th><th title="${esc(t('th_p_t'))}">${esc(t('th_p'))}</th><th title="${esc(t('th_pts_t'))}">${esc(t('th_pts'))}</th><th title="${esc(t('th_games_t'))}">${esc(t('th_games'))}</th><th title="${esc(t('th_diff_t'))}">+/−</th></tr></thead><tbody>`;
  rk.rows.forEach(r=>{
    const Q=q.allComplete?q.qualified[r.pid]:null;
    const cls=q.allComplete?(Q?'g':'r'):'';
    const ro=S.roster[r.pid]||{};
    const d=r.pw-r.pl;
    let tags=''; if(ro.seed) tags+=`<span class="tag seed">${esc(t('tag_seed'))}</span>`;
    if(Q&&Q.pos>A) tags+=`<span class="tag ok">${esc(t('tag_best',{n:Q.pos}))}</span>`;
    if(rk.complete&&(r.lot||(Q&&Q.lot))) tags+=`<span class="tag" title="${esc(t('tag_lot_t'))}">${esc(t('tag_lot'))}</span>`;
    h+=`<tr class="${cls}"><td>${r.rank}</td><td class="l">${esc(rn(r.pid))}${tags}</td><td>${r.p}</td><td><b>${r.w}</b></td><td>${r.gw}–${r.gl}</td><td>${d>0?'+':''}${d}</td></tr>`;
  });
  return h+'</tbody></table>';
}
function groupCard(g,q){
  const ev=q.ev[g.name],rk=q.rk[g.name],done=g.matches.filter(m=>ev[m.id].done).length,locked=!!S.ko;
  let h=`<section class="gcard" id="grp-${g.name}"><div class="ghead"><h3>${esc(t('group_n',{g:g.name}))}</h3><span class="chip ${rk.complete?'ok':''}">${esc(rk.complete?t('complete'):t('played_of',{d:done,t:g.matches.length}))}</span></div><div class="gbody">`;
  g.matches.forEach(m=>{
    h+=matchBlock('g:'+g.name+':'+m.id,nmObj(m.a),nmObj(m.b),ev[m.id],m.e,{pt:true,dis:locked,label:t('round_n',{n:m.round})});
  });
  return h+standingsHtml(g,q)+'</div></section>';
}
function extraHtml(q){
  if(!q.allComplete||q.extra<=0||!q.extraList) return '';
  const A=advN(),uneven=new Set(S.groups.map(g=>g.pids.length)).size>1;
  let h=`<div class="panel"><h3>${esc(t('extra_title',{n:A+1}))}</h3><p class="n">${esc(t('extra_note',{extra:q.extra,K:q.plan.K,uneven}))}</p>
  <table class="st"><thead><tr><th>#</th><th class="l">${esc(t('th_player'))}</th><th>${esc(t('th_group'))}</th><th>${esc(t('th_pts'))}</th><th>${esc(t('th_gd'))}</th><th>${esc(t('th_pd'))}</th></tr></thead><tbody>`;
  q.extraList.forEach((x,i)=>{
    const tag=x.lot?`<span class="tag" title="${esc(t('tag_lot_t'))}">${esc(t('tag_lot'))}</span>`:'';
    h+=`<tr class="${x.through?'g':'r'}"><td>${i+1}</td><td class="l">${esc(rn(x.pid))}${tag}</td><td>${x.group}</td><td>${x.w}</td><td>${x.gd>0?'+':''}${x.gd}</td><td>${x.pd>0?'+':''}${x.pd}</td></tr>`;
  });
  return h+'</tbody></table></div>';
}
function viewGroups(){
  const q=qualification(S);
  const total=S.groups.reduce((a,g)=>a+g.matches.length,0),done=S.groups.reduce((a,g)=>a+g.matches.filter(m=>q.ev[g.name][m.id].done).length,0);
  let h=`<section><div class="sechead"><div><h2>${esc(t('h_groups'))}</h2><p class="lead">${esc(t('lead_groups'))}</p></div><div class="prog">${t('prog',{d:done,t:total})}</div></div>`;
  if(S.ko) h+=`<div class="msg info" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1 1 240px">${esc(t('locked'))}</span><button class="btn ghost small" data-act="ask-unlock">${esc(t('unlock_btn'))}</button></div>`;
  h+=`<div class="gchips"><span style="font-size:13px;color:var(--ink-2)">${esc(t('jump'))}</span>${S.groups.map(g=>`<button class="gchip ${q.rk[g.name].complete?'ok':''}" data-act="jump" data-g="${g.name}">${g.name}</button>`).join('')}</div>`;
  h+=`<div class="ggrid">${S.groups.map(g=>groupCard(g,q)).join('')}</div>${extraHtml(q)}`;
  if(q.allComplete) h+=`<div class="legend" style="margin-top:16px"><span><i style="background:var(--ok-bg)"></i>${esc(t('legend_go'))}</span><span><i style="background:var(--no-bg)"></i>${esc(t('legend_out'))}</span></div>`;
  h+=`<div class="foot">`;
  if(S.ko) h+=`<button class="btn" data-act="go" data-v="knockout">${esc(t('go_ko'))}</button>`;
  else h+=`<button class="btn" data-act="mkko" ${q.allComplete?'':'disabled'}>${esc(t('mk_ko'))}</button><span class="hint" style="color:var(--ink-2);font-size:13px">${esc(q.allComplete?t('ko_ready',{N:q.plan.N,byes:q.plan.byes}):t('ko_wait',{d:done,t:total}))}</span>`;
  h+=`<button class="btn ghost" data-act="go" data-v="setup">${esc(t('back_setup'))}</button>`;
  if(!S.ko) h+=`<button class="btn ghost" data-act="ask-redraw">${esc(t('redraw'))}</button>`;
  return h+'</div></section>';
}

/* knockout */
function roundName(r,R){ const left=R-r; return left===1?t('r_final'):left===2?t('r_semi'):left===3?t('r_quarter'):t('r_of',{n:Math.pow(2,left)}); }
function matchLabel(r,R,i){ const left=R-r; return left===1?t('r_final'):left===2?t('m_semi',{n:i+1}):left===3?t('m_quarter',{n:i+1}):t('m_n',{n:i+1}); }
function byeCard(m,label,info){
  const pid=m.a||m.b;
  return `<div class="mc bye"><div class="mm"><span>${esc(label)}</span><span class="chip">${esc(t('bye'))}</span></div><div class="byebody"><small>${esc(info[pid].label)}</small><b>${esc(rn(pid))}</b> ${esc(t('goes_through'))}</div></div>`;
}
function koCard(m,label,info,medal){
  if(m.bye) return byeCard(m,label,info);
  const A=nmObj(m.a,info),B=nmObj(m.b,info),known=!!(m.a&&m.b);
  return matchBlock('k:'+m.id,A,B,m.ev,m.entry,{card:true,dis:!known,label,medal});
}
function viewKnockout(){
  const M=koModel(S.ko),info=S.ko.info,R=M.R;
  const rounds=M.rounds.map((ms,r)=>{
    const last=r===R-1,list=ms.map((m,i)=>koCard(m,matchLabel(r,R,i),info,last?'final':null)),all=ms.slice();
    if(last&&M.third){ list.push(koCard(M.third,t('third_match'),info,'third')); all.push(M.third); }
    return {t:roundName(r,R),list,ms:all};
  });
  const act=rounds.findIndex(r=>r.ms.some(m=>m.a&&m.b&&!m.bye&&!m.ev.done));
  const N=S.ko.N||S.ko.K;
  let h=`<section><div class="sechead"><div><h2>${esc(t('h_ko'))}</h2><p class="lead">${esc(t('lead_ko',{N}))}</p></div></div>`;
  if(M.fin.w){
    h+=`<div class="champ"><div class="place"><span>${esc(t('champion'))}</span><div class="big gold">${esc(rn(M.fin.w))}</div></div><div class="place"><span>${esc(t('runner'))}</span><div class="big silver">${esc(rn(M.fin.l))}</div></div>${M.third&&M.third.w?`<div class="place"><span>${esc(t('third'))}</span><div class="big bronze">${esc(rn(M.third.w))}</div></div>`:''}</div>`;
  }
  if(S.ko.rematch) h+=`<div class="msg warn">${esc(t('rematch'))}</div>`;
  if(S.ko.N&&S.ko.N<S.ko.K) h+=`<div class="msg info">${esc(t('byes_note',{n:S.ko.K-S.ko.N}))}</div>`;
  h+=`<div class="rnav"><span style="font-size:13px;color:var(--ink-2);align-self:center">${esc(t('go_to'))}</span>${rounds.map((r,i)=>`<button class="gchip ${i===act?'ok':''}" data-act="rnd" data-i="${i}">${esc(r.t)}</button>`).join('')}</div>`;
  h+=`<div class="legend"><span><i style="background:var(--ok-bg)"></i>${esc(t('won'))}</span><span><i style="background:var(--no-bg)"></i>${esc(t('lost'))}</span><span><i style="background:var(--gold)"></i>${esc(t('champion'))}</span><span><i style="background:var(--silver)"></i>${esc(t('runner'))}</span><span><i style="background:var(--bronze)"></i>${esc(t('third'))}</span></div>`;
  h+=`<div class="bracket" id="bracket" data-keep="bracket">${rounds.map((r,i)=>`<div class="rcol ${i===act?'act':''}"><h4>${esc(r.t)}</h4><div class="rbody">${r.list.join('')}</div></div>`).join('')}</div>`;
  h+=`<div class="foot"><button class="btn ghost" data-act="go" data-v="groups">${esc(t('back_ko'))}</button></div></section>`;
  return h;
}

/* ---------- render ---------- */
function applyStatic(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i);});
  document.querySelectorAll('[data-ia]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.ia));});
  document.querySelectorAll('.lb').forEach(b=>{const on=b.dataset.l===LANG; b.classList.toggle('on',on); b.setAttribute('aria-pressed',String(on));});
  if(!window.claude) document.title=t('app_title');
}
function setLang(l){ if(LANGS.indexOf(l)<0||l===LANG) return; LANG=l; try{localStorage.setItem('tt-lang',l);}catch(e){} render(); }
function render(focusKey,selStart){
  const keep={}; document.querySelectorAll('[data-keep]').forEach(el=>{keep[el.dataset.keep]=[el.scrollLeft,el.scrollTop];});
  applyStatic();
  stepper();
  app.innerHTML=noticeBar()+confirmBar()+(S.view==='setup'?viewSetup():S.view==='groups'?viewGroups():viewKnockout())+drawModalHtml();
  if(S.view==='setup') refreshSetup();
  document.querySelectorAll('[data-keep]').forEach(el=>{const k=keep[el.dataset.keep]; if(k){el.scrollLeft=k[0];el.scrollTop=k[1];}});
  if(focusKey){
    const el=app.querySelector('[data-k="'+focusKey+'"]');
    if(el&&!el.disabled){ el.focus(); try{el.setSelectionRange(selStart,selStart);}catch(e){} }
  }
}

/* ---------- save and load ---------- */
function exportData(){ return JSON.stringify({app:'tt-planner',v:1,saved:new Date().toISOString(),state:S},null,1); }
function parseData(text){
  const bad={err:'n_badfile'};
  let o; try{o=JSON.parse(text);}catch(e){return bad;}
  const st=o&&o.app==='tt-planner'?o.state:null;
  if(!st||st.v!==1||!st.setup||typeof st.setup!=='object'||!Array.isArray(st.players)||!st.players.length) return bad;
  if(!st.players.every(p=>p&&typeof p.id==='string'&&typeof p.name==='string')) return bad;
  if(st.groups!=null){
    if(!Array.isArray(st.groups)||!st.groups.every(g=>g&&Array.isArray(g.pids)&&Array.isArray(g.matches))) return bad;
  }
  if(st.ko!=null&&!Array.isArray(st.ko.first||st.ko.r16)) return bad;
  return {state:st};
}
function applyState(st){
  st.groups=st.groups||null; st.ko=st.ko||null; migrateKo(st); cleanNames(st); st.roster=st.roster||{}; st.lots=st.lots||{};
  if(typeof st.nextId!=='number') st.nextId=st.players.length+1000;
  if(st.view==='groups'&&!st.groups) st.view='setup';
  if(st.view==='knockout'&&!st.ko) st.view=st.groups?'groups':'setup';
  if(['setup','groups','knockout'].indexOf(st.view)<0) st.view='setup';
  S=st; save();
}
function downloadFile(){
  const blob=new Blob([exportData()],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a'),d=new Date(),z=n=>String(n).padStart(2,'0');
  a.href=url; a.download='table-tennis-tournament-'+d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);
  ui.notice={kind:'info',k:'n_saved'}; render(); window.scrollTo(0,0);
}
function loadText(text){
  const r=parseData(text);
  if(r.err){ ui.notice={kind:'err',k:r.err}; render(); window.scrollTo(0,0); return; }
  if(S.groups){ ui.pending=r.state; ui.confirm={k:'c_load',lk:'lbl_load',act:'loadfile'}; render(); window.scrollTo(0,0); }
  else{ applyState(r.state); render(); window.scrollTo(0,0); }
}
$('loadFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ loadText(String(rd.result)); e.target.value=''; };
  rd.onerror=()=>{ ui.notice={kind:'err',k:'n_unread'}; render(); e.target.value=''; };
  rd.readAsText(f);
});

/* ---------- events ---------- */
function ask(k,lk,act){ ui.confirm={k,lk,act}; render(); window.scrollTo(0,0); }
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList.contains('sc')){
    const v=t.value.replace(/\D/g,'').slice(0,2), pos=t.selectionStart;
    const en=entryFor(t.dataset.ref,true); if(!en) return;
    en.g[+t.dataset.i][+t.dataset.s]=v; save(); render(t.dataset.k,Math.min(pos,v.length));
  }else if(t.classList.contains('pname')){
    const p=S.players.find(x=>x.id===t.dataset.id); if(p){p.name=t.value; if(S.roster[p.id]) S.roster[p.id].name=t.value; save();}
  }
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('wo')){
    const en=entryFor(t.dataset.ref,true); if(!en) return; en.wo=t.value||null; save(); render(); return;
  }
  if(t.classList.contains('ord')){
    setOrder(t.dataset.id,Number(t.value)); save(); $('plist').innerHTML=plistHtml(); return;
  }
  if(t.dataset.f){
    const f=t.dataset.f,raw=t.value.trim(),v=raw===''?NaN:Math.round(Number(raw));
    S.setup[f]=Number.isFinite(v)?v:NaN;
    if(f==='n'&&Number.isFinite(v)&&v>=1){ resizePlayers(v); }
    if((f==='n'||f==='g')&&Number.isFinite(S.setup.n)&&Number.isFinite(S.setup.g)&&S.setup.g>=1){ S.setup.per=Math.ceil(S.players.length/S.setup.g); $('f-per').value=S.setup.per; }
    $('f-n').value=Number.isFinite(S.setup.n)?S.setup.n:'';
    save(); $('plist').innerHTML=plistHtml(); refreshSetup();
  }
});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='go'){ if(b.dataset.v==='groups'&&!S.groups||b.dataset.v==='knockout'&&!S.ko) return; S.view=b.dataset.v; ui.confirm=null; save(); render(); window.scrollTo(0,0); }
  else if(a==='addp'){ addPlayer(); save(); $('f-n').value=S.setup.n; $('f-per').value=S.setup.per; $('plist').innerHTML=plistHtml(); refreshSetup(); const l=$('plist'); l.scrollTop=l.scrollHeight; }
  else if(a==='up'||a==='down'){ movePlayer(b.dataset.id,a==='up'?-1:1); save(); $('plist').innerHTML=plistHtml(); }
  else if(a==='del'){ removePlayer(b.dataset.id); save(); $('f-n').value=S.setup.n; $('f-per').value=S.setup.per; $('plist').innerHTML=plistHtml(); refreshSetup(); }
  else if(a==='usepaste'){ usePasted($('pasteTxt').value); save(); render(); }
  else if(a==='mkgroups'){
    if(S.groups&&hasScores()) ask('c_again','create_again','mkgroups');
    else{ startDraw(); render(); window.scrollTo(0,0); }
  }
  else if(a==='ask-redraw'){
    if(hasScores()) ask('c_redraw','redraw','mkgroups');
    else{ startDraw(); render(); }
  }
  else if(a==='ask-unlock') ask('c_unlock','unlock_btn','unlock');
  else if(a==='confirm-yes'){
    const c=ui.confirm; ui.confirm=null;
    if(c.act==='mkgroups') startDraw(); else if(c.act==='unlock'){S.ko=null;S.view='groups';} else if(c.act==='startover') startOver(); else if(c.act==='loadfile'&&ui.pending){ applyState(ui.pending); ui.pending=null; }
    save(); render(); window.scrollTo(0,0);
  }
  else if(a==='confirm-no'){ ui.confirm=null; ui.pending=null; render(); }
  else if(a==='draw-next'){ if(ui.draw&&ui.draw.i<ui.draw.seq.length){ ui.draw.i++; render(); } }
  else if(a==='draw-redraw'){ startDraw(); render(); }
  else if(a==='draw-commit'){ if(ui.draw&&ui.draw.i>=ui.draw.seq.length){ createGroups(ui.draw.groups); save(); render(); window.scrollTo(0,0); } }
  else if(a==='draw-cancel'){ ui.draw=null; render(); }
  else if(a==='mkko'){ createKnockout(); save(); render(); window.scrollTo(0,0); }
  else if(a==='jump'){ const el=document.getElementById('grp-'+b.dataset.g); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
  else if(a==='rnd'){ const br=$('bracket'),col=br.children[+b.dataset.i]; br.scrollTo({left:col.offsetLeft-br.offsetLeft,behavior:'smooth'}); }
});
document.getElementById('steps').addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(b) handleStep(b); });
function handleStep(b){ const v=b.dataset.v; if(v==='groups'&&!S.groups||v==='knockout'&&!S.ko) return; S.view=v; ui.confirm=null; save(); render(); window.scrollTo(0,0); }
document.querySelector('.top').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='ask-startover') ask('c_startover','startover','startover');
  else if(a==='save') downloadFile();
  else if(a==='load') $('loadFile').click();
  else if(a==='lang') setLang(b.dataset.l);
});

render();
</script>
